name: host-gate

# Runs the GPU-free reliability gate on every push and pull request.
# The GPU suites (cross-verify, determinism, polymul-sweep, modops)
# require gfx942/gfx1030 hardware and are NOT part of CI — they run on
# the MI300A / 6900XT manually via scripts/gpu_run.sh.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  host-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev

      - name: Run host reliability gate
        run: bash scripts/ci.sh

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: results/check_*.log
          if-no-files-found: ignore
