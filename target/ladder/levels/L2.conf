# target/ladder/levels/L2.conf - ladder level L2 (64 node(s) = 256 APUs). KEY=VALUE, # comments; ladder.sh --set KEY=VALUE overrides any key.
# Digits = 6.632e10 per node x nodes (the headline's per-node share 3.82e13/576). The plan (FIT) is checked first; a size that does not fit is refused.
LEVEL=L2
NODES=64
DIGITS=4244480000000
# PATH: 1 = default build (libfabric xshmem, layout D), 2 = XSHMEM=cray with ECALC_PE_PER_GPU=1 XSHMEM_LANES=2, both = each replica runs both (order alternates by replica)
PATH=both
# RUNS = sequential runs per replica and path; REPLICAS = identical jobs in parallel (disjoint adjacent groups)
RUNS=1
REPLICAS=2
# WRITE: 0 = no digit file, 1 = every run writes ECALC_OUT_DIR/..., first = only replica 1 (its first run of each path)
WRITE=first
# Slurm time limit of one replica job, minutes (all its runs)
TIME_MIN=45
# modelled wall (mod, ecalc/mn_model.py estimate --fabric target --g 64 --D 6.632e10): without and with the part-file write
MODEL_NOWRITE_S=149.6
MODEL_WRITE_S=160.4
ENV_ECALC_VERBOSE=1
