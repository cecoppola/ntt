# target/ladder/levels/L3.conf - ladder level L3 (576 node(s) = 2304 APUs). KEY=VALUE, # comments; ladder.sh --set KEY=VALUE overrides any key.
# Digits = 8e9 per node x nodes (user decision Q120, 2026-10-25: fewer digits so every code path fits -- layout D, P and path 2 at
# 1/8/64/576 nodes; worst case path 2 at 576 n device 328.69 GB, node 406.32 GB, mod planner; the 3.82e13 headline comes later).
# Staircase (user decision Q121, 2026-10-25), each step only after the previous one passed (ADJUST.md gate), run tags s1-s3:
#   s1: this file as is (4.608e12, both paths, write)
#   s2: --set DIGITS=10000000000000 --set WRITE=0 --set MODEL_NOWRITE_S=52.3 --set MODEL_WRITE_S=55.3
#       (1e13 = 1.74e10 per node: path 1 fits, device 238.97 GB; path 2 refused, device 380.23 of 373.44 GB -> ladder.sh drops it)
#   s3: --set DIGITS=38200000000000 --set PATH=1 --set WRITE=0 --set MODEL_NOWRITE_S=187.1 --set MODEL_WRITE_S=191.2
#       (the headline; fits with MN_NONPOW2_CAP=0 below: device 358.96 GB, node 395.04 GB, mod planner)
# The plan (FIT) is checked first; a size that does not fit is refused.
LEVEL=L3
NODES=576
DIGITS=4608000000000
# PATH: 1 = default build (libfabric xshmem, layout D), 2 = XSHMEM=cray with ECALC_PE_PER_GPU=1 XSHMEM_LANES=2, both = each replica runs both (order alternates by replica)
# Q120: at 8e9 per node path 2 fits at 576 n (device 328.69 GB of 373.44, mod planner): both paths run
PATH=both
# RUNS = sequential runs per replica and path; REPLICAS = identical jobs in parallel (disjoint adjacent groups)
RUNS=2
REPLICAS=1
# WRITE: 0 = no digit file, 1 = every run writes ECALC_OUT_DIR/..., first = only replica 1 (its first run of each path)
WRITE=1
# Slurm time limit of one replica job, minutes (all its runs)
TIME_MIN=75
# modelled wall (mod, ecalc/mn_model.py estimate --fabric target --g 576 --D 8e9): without and with the part-file write
MODEL_NOWRITE_S=32.0
MODEL_WRITE_S=33.2
ENV_ECALC_VERBOSE=1
# plane cap (Q122 (c), user 2026-10-25): no launch setting; the code default ECALC_PLANE_CAP=run picks 2^30 at the 8e9 share
# (planner: 1/8/64/576 n, mod; aac7 1 n 8e9 2^30 vs 2^31: total -2.64 s [-2.98, -2.30], digits identical, m) and 2^31 above ~9.6e9 per node
# user decision Q119 2026-10-25 (for 3.82e13: fits only with it off); at the Q120 share of 8e9 per node the auto default is off anyway (it engages from 4.5e10)
ENV_MN_NONPOW2_CAP=0
# PATH=both here; --path 1 or 2 (or the path that won at L1/L2, see ADJUST.md) changes it. WRITE=1: the one write run of the ladder (2.0 TB packed at 4.608e12); --set WRITE=0 for a dry timing run.
