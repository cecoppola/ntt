# target/ladder/levels/L3.conf - ladder level L3 (576 node(s) = 2304 APUs). KEY=VALUE, # comments; ladder.sh --set KEY=VALUE overrides any key.
# Digits = 6.632e10 per node x nodes (the headline's per-node share 3.82e13/576). The plan (FIT) is checked first; a size that does not fit is refused.
LEVEL=L3
NODES=576
DIGITS=38200000000000
# PATH: 1 = default build (libfabric xshmem, layout D), 2 = XSHMEM=cray with ECALC_PE_PER_GPU=1 XSHMEM_LANES=2, both = each replica runs both (order alternates by replica)
PATH=2
# RUNS = sequential runs per replica and path; REPLICAS = identical jobs in parallel (disjoint adjacent groups)
RUNS=1
REPLICAS=1
# WRITE: 0 = no digit file, 1 = every run writes ECALC_OUT_DIR/..., first = only replica 1 (its first run of each path)
WRITE=1
# Slurm time limit of one replica job, minutes (all its runs)
TIME_MIN=75
# modelled wall (mod, ecalc/mn_model.py estimate --fabric target --g 576 --D 6.632e10): without and with the part-file write
MODEL_NOWRITE_S=187.1
MODEL_WRITE_S=191.2
ENV_ECALC_VERBOSE=1
# user decision Q119 2026-10-25: 3.82e13 fits only with it off (device 358.96 vs 407.41 GB, mod planner)
ENV_MN_NONPOW2_CAP=0
# PATH=2 here is the target shape; set --path 1 (or the level that won at L1/L2, see ADJUST.md) to change. WRITE=1: the one write run of the ladder (15.9 TB); --set WRITE=0 for a dry timing run.
