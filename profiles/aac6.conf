# profiles/aac6.conf -- machine profile for aac6 (AMD MI300A nodes, Mellanox/InfiniBand mlx5, no cxi NIC, no Cray SHMEM).
# Format and rules: profiles/README.md.  Draft 2026-10-11 (agent c01). aac6 is SET ASIDE (user, 2026-10-12).
# aac6 is a correctness/coverage machine: single node is the standard (tools/gate.sh), there is no multi-process launch here: the OSHMEM and SOS forms of mnrun.sh were removed 2026-10-12 (D14), as was the TCP transport.
# Facts read on the login node 2026-10-11 (read-only): no /opt/cray/pe/sma, no /sys/class/cxi, mlx5_0/1 present, partitions
# PPAC_MI300A_SPX (192 CPUs, 514000 MB) and SH5_MI300A_CPX/SPX (48 CPUs, 120000 MB).  (m)

# ---- [modules/build] ------------------------------------------------------------------------------------------------
MNRUN_MODULES=rocm                                     # mnrun.sh default where /opt/cray/pe/sma is absent; build: bash -lc "module load rocm; make -s -j16" (AGENT_PROTOCOL)
# No SHMEM_CRAY: Cray SHMEM is absent, so multi-node SHMEM is not built (tools/gate.sh refuses --nodes > 1 here).

# ---- [transport] ----------------------------------------------------------------------------------------------------
# COMM_TRANSPORT is NOT set: single-node runs need none (multi-process launches are Cray SHMEM only since D14, 2026-10-12).
COMM_SHMEM_SERIAL=1                                    # the code default 1 (README COMM_SHMEM_SERIAL row); recorded, = default

# ---- [libfabric] ----------------------------------------------------------------------------------------------------
# No cxi: COMM_OFI stays off through the code's own default (comm_ofi is on only where a cxi NIC is present, OFI17.md).
# FI_MR_CACHE_MONITOR / FI_UNIVERSE_SIZE / FI_LOG_LEVEL: mnrun.sh applies them only on its SHMEM path; nothing to pin here.

# ---- [memory pools tied to the hardware] ----------------------------------------------------------------------------
# COMM_SHMEM_POOL_MB: COMPUTED by mnrun.sh (plan pool; heap = pool + 512 MiB).
# SH5 CPX nodes (6 XCDs of 22.9 GB, T11 / S44): runs up to 4e9 digits need the two keys below -- set them in a CPX sub-profile once the
# entry point supports one.  Left commented: they would break the PPAC SPX nodes.
# RNS_INIT_POOL_LOG=29                                 # README CPX launch note (T11.md)
# ECALC_PLANE_CAP=2^30                                 # README CPX launch note (T11.md)
# BS_SEED_PULL=0                                       # README CPX launch note: the pull kernel hangs on a CPX XCD (MRG 2026-10-12)

# ---- [safety/diagnostics] -------------------------------------------------------------------------------------------
ECALC_SEGV_TRACE=1                                     # tools/gate.sh always sets it (user 2026-10-11)

# ---- [host exclusions] ----------------------------------------------------------------------------------------------
# none known.  Site rules (not keys): jobs <= 45 min; the admin's nightly CI array holds all nodes ~00:00-03:30 Eastern (AGENT_PROTOCOL).
