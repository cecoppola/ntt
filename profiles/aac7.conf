# profiles/aac7.conf -- machine profile for aac7 (HPE Cray EX, 4 x MI300A + Slingshot-11 per node, Cray OpenSHMEMX).
# Format and rules: profiles/README.md.  One KEY=value per line, shell-sourceable, no export, no command substitution.
# Revised 2026-10-25 (cleanup round 4, Q103/Q107/Q110).  Read by: tools/gate.sh (--line aac7 takes the launch line from LAUNCH_LINE_KEYS below;
# --profile loads every key), tools/profile_load.py (--line, --check, --run) and tools/plan_values.py.  This file is the one source of the
# aac7 launch line (SCR2, D15) and holds only values that DIFFER from the code's defaults.  What the scripts default themselves is not repeated
# here (Q107): ecalc/aac7env.sh (AAC7_ROCM=rocm/7.2.4, MNRUN_MODULES, MNRUN_CPUS_PER_TASK=auto, MNACCEPT_TMP, AAC7_PART, GMP_HOME) and
# ecalc/mnrun.sh (MNRUN_UNLOAD=rocm/7.0.3, FI_MR_CACHE_MONITOR=userfaultfd, FI_LOG_LEVEL=warn, FI_UNIVERSE_SIZE, the pools and heaps from the plan).
# The two supported multi-node paths (README, Q85): path 1 libfabric (default build, `mnrun.sh <n> env ./ecalc <digits>`) and path 2 Cray
# SHMEM (`XSHMEM=cray` build, `ECALC_PE_PER_GPU=1 XSHMEM_LANES=2`; RNS_BATCH_SPLIT is automatic there, Q110).  Both use these keys.
# Evidence tags: (m) measured, (mod) modelled, (a) assumed.  Times Eastern.
# Not in this file by design: password/host credentials (private protocol), sizes derived from the digit count (plan stage).

# ---- [memory budget] ------------------------------------------------------------------------------------------------
ECALC_MEM_GUARD_GB=6                                   # named stop (rc 9) instead of the OOM killer (user decision 2026-09-27); code default 0 = off
ECALC_DEVICE_GB=444.0                                  # FIT (D26): the device edge per node (m, aac7 SPX, t_edge, job 12287: VMM 444.0 GB committed, hipMalloc ~448.0; archive:RESULTS_ARCHIVE_1-114.md 107); code default 373.44 = the target's; the fit refuses a run above it
ECALC_NODE_GB=420                                      # the node budget: aac7 idle MemAvailable is 418-420 GB (m, 9w9_s2dfull3; sinfo says 500000 MB); the code default 480 is the target's figure

# ---- [exchange tuning] (adopted by the user, not yet code defaults) -----------------------------------------------
MN_T_CHUNK_MB=2048                                     # T2048: aac7 line since 2026-10-08 (S22 D2: 24 paired rounds, mean -42.3 s, p~0.04, m); code default 1024

# ---- [safety/diagnostics] -------------------------------------------------------------------------------------------
ECALC_SEGV_TRACE=1                                     # tools/gate.sh always sets it; user 2026-10-11: on the target line too
ECALC_VERBOSE=2                                        # launch line
MEM_REPORT_DEVS=1                                      # launch line
ECALC_LOG_CLOCKS=1                                     # aac7env.sh --log block per node

# ---- [launch line] --------------------------------------------------------------------------------------------------
# The words of the aac7 launch line, in launch order, taken as KEY=value from the keys above: `tools/profile_load.py aac7 --line` prints
# them; tools/gate.sh --line aac7 runs them.  One source: change a value above, not here.
LAUNCH_LINE_KEYS="MN_T_CHUNK_MB ECALC_MEM_GUARD_GB ECALC_DEVICE_GB ECALC_VERBOSE MEM_REPORT_DEVS ECALC_LOG_CLOCKS"

# ---- [host exclusions] ----------------------------------------------------------------------------------------------
MNRUN_EXCLUDE_HOSTS=aac7-n01                      # S31.md: ~20-25 s host->device upload stall (m); AGENT_PROTOCOL; the user 2026-10-11 also excludes aac7-n61 (SESSION rules) -- see open question in results/TOOLS_PROFILES.md §C01
MNRUN_EXCLUDE_MODE=drop                                # mnrun.sh: default 'warn' only warns; 'drop' removes the host from the list (needs spare nodes in the hold)
