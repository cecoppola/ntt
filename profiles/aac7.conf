# profiles/aac7.conf -- machine profile for aac7 (HPE Cray EX, 4 x MI300A + Slingshot-11 per node, Cray OpenSHMEMX).
# Format and rules: profiles/README.md.  One KEY=value per line, shell-sourceable, no export, no command substitution.
# Draft 2026-10-11 (agent c01), filled from ecalc/aac7env.sh, ecalc/mnrun.sh, the old LINE of ecalc/e16_headline.sh, the README
# launch-line table and the user's decisions of 2026-10-11 (SESSION wave B).
# Read by: tools/gate.sh (--line aac7 takes the launch line from LAUNCH_LINE_KEYS below; --profile loads every key), tools/profile_load.py
# (--line, --check, --run) and tools/plan_values.py.  SCR2 (D15, 2026-10-12): this file is the one source of the aac7 launch line.
# Evidence tags: (m) measured, (mod) modelled, (a) assumed.  Times Eastern.
# Not in this file by design: password/host credentials (private protocol), sizes derived from the digit count (plan stage).

# ---- [modules/build] ------------------------------------------------------------------------------------------------
AAC7_ROCM=rocm/7.2.4                                   # ecalc/aac7env.sh; results/V16.md: same digits as 7.0.3, 168.5 vs 205.9 s at 1e11 (m)
MNRUN_MODULES="cray-dsmml cray-openshmemx rocm/7.2.4"  # ecalc/aac7env.sh, mnrun.sh (derived there from AAC7_ROCM when /opt/cray/pe/sma exists)
MNRUN_UNLOAD=rocm/7.0.3                                # mnrun.sh, results/V16.md step 1: the login default conflicts with the versioned rocm
SHMEM_CRAY=1                                           # build flag: make -B SHMEM_CRAY=1 GMP_HOME=~/gmp (AGENT_PROTOCOL build note; tools/gate.sh checks -DCOMM_SHMEM)
COMM_SHMEM_IMPL=cray                                   # the only launch form since D14 (2026-10-12); mnrun.sh detects it from the binary (Phase 16 A, results/A16.md)
AAC7_PART=192C4G1H_MI300A_RHEL9_A1                     # ecalc/aac7env.sh: the sbatch partition of whole 4-APU nodes
MNRUN_CPUS_PER_TASK=auto                               # aac7env.sh: srun confines a task to 2 CPUs otherwise (A16)

# ---- [paths] (HOME-relative; the entry point expands them, gate.sh --line file: does not) ----------------------------
MNACCEPT_TMP=$HOME/p16/mnaccept_tmp                    # aac7env.sh: the nodes' /tmp is RAM, so mnaccept scratch lives under HOME
GMP_HOME=$HOME/gmp                                     # aac7env.sh: aac7 has no gmp.h; a GMP built from source (README build line)

# ---- [transport] ----------------------------------------------------------------------------------------------------
COMM_TRANSPORT=shmem                                   #  README launch table
COMM_SHMEM_SERIAL=0                                    # per-thread contexts on Cray OpenSHMEMX (README COMM_SHMEM_SERIAL row)
COMM_SHMEM_DEVHEAP=1                                   # symmetric heap is device memory on the APU (S12, A16)
COMM_OFI=1                                             # README launch row (default 1 where a cxi NIC exists; shown for the record), OFI17.md
COMM_SHMEM_ROUND_MB=1024                               #  V114.md (pool 45.0 -> 9.8 GB at 576, mod)

# ---- [libfabric] (mnrun.sh sets these defaults itself; listed so the profile is the single record) ------------------
FI_MR_CACHE_MONITOR=userfaultfd                        # mnrun.sh, S46: memhooks hangs ROCr<->libfabric, base 22/105 vs uffd 0/104 (m); 'disabled' corrupts exchanges, refused
FI_LOG_LEVEL=warn                                      # mnrun.sh (the user's L2, TGTBENCH2): cuts libfabric output ~1000x
# FI_UNIVERSE_SIZE is computed by mnrun.sh = max(4096, 4 x ntasks)   (TGTBENCH2 L2): not a profile key.

# ---- [memory pools tied to the hardware] ----------------------------------------------------------------------------
# COMM_SHMEM_POOL_MB, SHMEM_SYMMETRIC_SIZE, XT_SYMMETRIC_HEAP_SIZE, COMM_OFI_POOL_MB: COMPUTED (mnrun.sh from MN_PLAN_ONLY; heap = pool + 512 MiB). Not typed here.
ECALC_MEM_GUARD_GB=6                                   # named stop (rc 9) instead of the OOM killer (user decision 2026-09-27)
ECALC_DEVICE_GB=444.0                                  # FIT (D26): the device edge per node (m, aac7 SPX, t_edge, job 12287: VMM 444.0 GB committed, hipMalloc ~448.0; archive:RESULTS_ARCHIVE_1-114.md 107); the fit refuses a run above it
# ECALC_NODE_GB is not set: aac7 nodes have 500000 MB (sinfo, m); the code default 480 is the target's figure -- see README open question.

# ---- [exchange tuning] (adopted by the user, not yet code defaults) -----------------------------------------------
MN_T_CHUNK_MB=2048                                     # T2048: aac7 line since 2026-10-08 (S22 D2: 24 paired rounds, mean -42.3 s, p~0.04, m); code default 1024

# ---- [adopted algorithm switches, pending move to built-in defaults] -------------------------------------------------
ECALC_NP=auto                                          # user decision 1, 2026-09-28 (README ECALC_NP=auto row)

# ---- [safety/diagnostics] -------------------------------------------------------------------------------------------
ECALC_SEGV_TRACE=1                                     # tools/gate.sh always sets it; user 2026-10-11: on the target line too (README ECALC_SEGV_TRACE row)
ECALC_VERBOSE=2                                        # launch line
MEM_REPORT_DEVS=1                                      # launch line
ECALC_LOG_CLOCKS=1                                     # aac7env.sh --log block per node

# ---- [launch line] --------------------------------------------------------------------------------------------------
# The words of the aac7 launch line, in launch order, taken as KEY=value from the keys above: `tools/profile_load.py aac7 --line` prints
# them; tools/gate.sh --line aac7 runs them (before D15 they were the LINE= of ecalc/e16_headline.sh, archived).  One source: change a
# value above, not here.  (Dropped from the old line: the COMM_LAYER_* defaults and the division / cache keys that are built in.)
LAUNCH_LINE_KEYS="COMM_TRANSPORT COMM_SHMEM_SERIAL COMM_SHMEM_DEVHEAP ECALC_NP MN_T_CHUNK_MB COMM_SHMEM_ROUND_MB ECALC_MEM_GUARD_GB ECALC_DEVICE_GB ECALC_VERBOSE MEM_REPORT_DEVS ECALC_LOG_CLOCKS"

# ---- [host exclusions] ----------------------------------------------------------------------------------------------
MNRUN_EXCLUDE_HOSTS=aac7-n01                      # S31.md: ~20-25 s host->device upload stall (m); AGENT_PROTOCOL; the user 2026-10-11 also excludes aac7-n61 (SESSION rules) -- see open question in results/C01.md
MNRUN_EXCLUDE_MODE=drop                                # mnrun.sh: default 'warn' only warns; 'drop' removes the host from the list (needs spare nodes in the hold)
